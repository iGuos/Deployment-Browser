name: deployment
description: "Jenkins 发版管理工具 · 桌面 + 移动跨平台"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^3.3.1

  # 路由
  go_router: ^17.2.3

  # 网络
  dio: ^5.9.2

  # 本地存储
  shared_preferences: ^2.5.5

  # 平台能力
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

  # 二维码（账号分享）
  qr_flutter: ^4.1.0

  # 国际化 / 工具
  intl: ^0.20.2
  logger: ^2.7.0
  collection: ^1.19.1
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  cryptography: ^2.9.0
  mobile_scanner: ^7.2.0
  file_selector: ^1.1.0
  desktop_multi_window: ^0.3.0
  basic_utils: ^5.8.2
  crypto: ^3.0.7
  flutter_local_notifications: ^22.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
